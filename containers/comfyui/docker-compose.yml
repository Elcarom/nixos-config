services:
  comfyui:
    image: yanwk/comfyui-boot:cu128-megapak
    container_name: comfyui

    restart: unless-stopped

    ports:
      - "8188:8188"

    environment:
      - CLI_ARGS=--listen 0.0.0.0

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    volumes:
      - /srv/nfs/comfyui/models:/root/ComfyUI/models
      - /srv/nfs/comfyui/input:/root/ComfyUI/input
      - /srv/nfs/comfyui/output:/root/ComfyUI/output
      - /srv/nfs/comfyui/user:/root/ComfyUI/user
      - /srv/nfs/comfyui/temp:/root/ComfyUI/temp
